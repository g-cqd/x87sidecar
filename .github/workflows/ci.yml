name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Ensure Rosetta is installed
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Check the unhooked fallback
        # Cooperative mode with X87_FORCE_UNSUPPORTED=1 only execs the target,
        # so this needs no privileges.
        run: python3 scripts/test_unhooked_fallback.py

      - name: Probe the installed Rosetta
        id: probe
        # Locates every anchor this build hooks in the runner's Rosetta and
        # validates the assumptions behind them; exits non-zero if any is
        # off. A non-zero exit means this build's audited assumptions about
        # the installed Rosetta (e.g. the allocator-caller lock contract in
        # offset_finder.cpp, pinned by whole-function SHA-256) do not hold on
        # this runner, not that the runner lacks Rosetta outright. That gap
        # needs a new control-flow audit of the runtime, never a relaxed
        # byte match, so steps below that need the hook are skipped rather
        # than failed: CI stays meaningful on everything this build can
        # actually verify, instead of either blocking on an unauditable
        # runtime or silently trusting an unverified one.
        run: |
          if build/bin/x87sidecar --probe; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Rosetta-dependent steps will be skipped: this build's audited assumptions about the installed Rosetta do not hold on this runner (see the probe output above)."
          fi

      - name: Run tests
        if: steps.probe.outputs.supported == 'true'
        # PT_ATTACH on macOS needs either the debugger entitlement (granted
        # via an interactive system dialog on first launch — not available
        # in headless CI, would hang the job) or root.  GitHub's macos-26
        # runners give passwordless sudo, so just use that.
        run: sudo python3 scripts/diagnose_ci.py --output-dir build/ci-diagnostics -- bash scripts/run_tests.sh --no-build

      - name: Check concurrent profiler output paths
        if: steps.probe.outputs.supported == 'true'
        run: sudo python3 scripts/test_profile_paths.py

      - name: Skip Rosetta-dependent tests
        if: steps.probe.outputs.supported != 'true'
        # "Run tests" and "Check concurrent profiler output paths" both
        # attach through the hook the probe step just found unsupported;
        # running them anyway would exercise an unaudited runtime and could
        # report false confidence. Skip visibly instead of failing the job
        # for a runner-side Rosetta mismatch this build cannot yet verify.
        run: |
          echo "::warning::Skipped: Rosetta unavailable on this runner (probe reported the installed Rosetta unsupported; see the 'Probe the installed Rosetta' step)."
          {
            echo "### Rosetta-dependent tests skipped"
            echo "The installed Rosetta on this runner did not match this build's audited assumptions (see the \`Probe the installed Rosetta\` step log). \`Run tests\` and \`Check concurrent profiler output paths\` were skipped, not failed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          path: build/ci-diagnostics
          if-no-files-found: ignore
